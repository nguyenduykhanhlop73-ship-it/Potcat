name: Build Pet Dot Nyanko APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 4 -type f -iname 'PetDotNyanko*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "No PetDotNyanko ZIP found in the repository."
            echo "Upload the Android project ZIP to the repository root, or rename it to PetDotNyanko_Android_Project.zip."
            echo "Files found in repository:"
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi
          echo "Using project archive: $ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR=$(find extracted -type f -path '*/app/build.gradle' -print -quit | sed 's#/app/build.gradle##')
          if [ -z "$PROJECT_DIR" ]; then
            echo "ZIP was extracted, but no Android app/build.gradle was found."
            find extracted -maxdepth 5 -type f | head -100
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project at: $PROJECT_DIR"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/output/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pet-Dot-Nyanko-Android-APK
          path: output/app-debug.apk
          if-no-files-found: error
