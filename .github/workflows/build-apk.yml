name: Build Pet Dot Nyanko APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PetDotNyanko_Android_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q PetDotNyanko_Android_Project.zip -d extracted
          test -f extracted/PetDotNyanko_Android_Project/app/build.gradle

      - name: Build debug APK
        working-directory: extracted/PetDotNyanko_Android_Project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pet-Dot-Nyanko-Android-APK
          path: extracted/PetDotNyanko_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
