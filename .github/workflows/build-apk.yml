name: Build Pet Dot Nyanko APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PetDotNyanko_Android_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runner already includes Android command-line tools.
      # Avoid setup-android here: its legacy "tools" package request caused
      # the sdkmanager failure seen in the previous run.
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q PetDotNyanko_Android_Project.zip -d extracted
          test -f extracted/PetDotNyanko_Android_Project/app/build.gradle

      - name: Build debug APK
        working-directory: extracted/PetDotNyanko_Android_Project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pet-Dot-Nyanko-Android-APK
          path: extracted/PetDotNyanko_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
